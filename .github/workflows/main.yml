name: 🔄 Update ADG Rules

on:
  schedule:
    - cron: '35 21 * * *'  # 北京时间 05:35
  workflow_dispatch:
    inputs:
      force_accept:
        description: '强制接受本次变动（绕过熔断器，仅用于故意换源等大调整）'
        type: boolean
        default: false

concurrency:
  group: rules-update
  cancel-in-progress: true

jobs:
  build:
    name: 🛠️ 规则加工处理
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 主动提前切入 Node 24 运行时（Node 20 将于 2026-09-16 从 Runner 移除）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write 
    
    steps:
      - name: ⬇️ 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: pip install -q requests urllib3

      - name: 🚀 执行规则合并脚本
        run: python process_rules.py -o my_adg_rules.txt

      - name: 🔍 验证输出
        run: |
          if [ ! -s my_adg_rules.txt ]; then
            echo "❌ Empty file!"
            exit 1
          fi
          echo "✅ $(wc -l < my_adg_rules.txt) lines, $(du -h my_adg_rules.txt | cut -f1)"

      - name: 🛡️ 规则数量熔断检查
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_accept }}" = "true" ]; then
            echo "⚠️ 已手动强制接受，本次跳过熔断检查"
            exit 0
          fi

          NEW_COUNT=$(grep -c '^||\|^@@' my_adg_rules.txt || echo 0)
          OLD_COUNT=$(git show HEAD:my_adg_rules.txt 2>/dev/null | grep -c '^||\|^@@' || echo 0)
          
          echo "📊 旧规则数: $OLD_COUNT, 新规则数: $NEW_COUNT"
          
          if [ "$OLD_COUNT" -gt 0 ]; then
            DELTA=$(( (NEW_COUNT - OLD_COUNT) * 100 / OLD_COUNT ))
            DELTA=${DELTA#-} 
            echo "📈 变动幅度: ${DELTA}%"
            if [ "$DELTA" -gt 30 ]; then 
              echo "❌ 规则变动超过 30%，触发安全熔断，停止提交！"
              exit 1
            fi
          else
            echo "ℹ️ 首次生成或无法对比旧文件，跳过熔断检查。"
          fi

      - name: 📤 提交与推送
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🔄 auto: ADG rules update (Pro/AdRules/TIF Mini)"
          file_pattern: "my_adg_rules.txt" 

      - name: 📦 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: rules-${{ github.run_number }}
          path: my_adg_rules.txt
          retention-days: 2
