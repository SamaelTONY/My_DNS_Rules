name: 🔄 Update ADG Rules

on:
  schedule:
    - cron: '35 21 * * *'  # 北京时间 05:35
  workflow_dispatch:

# 🔑 防止并发运行导致冲突
concurrency:
  group: rules-update
  cancel-in-progress: true

jobs:
  build:
    name: 🛠️ 规则加工处理
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write 
    
    steps:
      # 1. 拉取代码
      - name: ⬇️ 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 只需要最新提交即可

      # 2. 设置 Python
      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: 📦 安装依赖
        run: pip install -q requests urllib3

      # 4. 执行脚本
      - name: 🚀 执行规则合并脚本
        run: python process_rules.py -o my_adg_rules.txt

      # 5. 验证输出
      - name: 🔍 验证输出
        run: |
          if [ ! -s my_adg_rules.txt ]; then
            echo "❌ Empty file!"
            exit 1
          fi
          echo "✅ $(wc -l < my_adg_rules.txt) lines, $(du -h my_adg_rules.txt | cut -f1)"

      # 🔑 6. 规则数量熔断 (防上游投毒/大面积故障)
      - name: 🛡️ 规则数量熔断检查
        run: |
          NEW_COUNT=$(grep -c '^||\|^@@' my_adg_rules.txt || echo 0)
          # 尝试获取仓库中上一版的行数，如果是首次运行则设为 0
          OLD_COUNT=$(git show HEAD:my_adg_rules.txt 2>/dev/null | grep -c '^||\|^@@' || echo 0)
          
          echo "📊 旧规则数: $OLD_COUNT, 新规则数: $NEW_COUNT"
          
          if [ "$OLD_COUNT" -gt 0 ]; then
            # 计算变动百分比 (绝对值)
            DELTA=$(( (NEW_COUNT - OLD_COUNT) * 100 / OLD_COUNT ))
            DELTA=${DELTA#-} 
            
            echo "📈 变动幅度: ${DELTA}%"
            if [ "$DELTA" -gt 30 ]; then 
              echo "❌ 规则变动超过 30%，触发安全熔断，停止提交！" 
              exit 1
            fi
          else
            echo "ℹ️ 首次生成或无法对比旧文件，跳过熔断检查。"
          fi

      # 7. 提交与推送
      - name: 📤 提交与推送
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 auto: ADG rules update (Pro/AdRules/Privacy)"
          file_pattern: "my_adg_rules.txt" 
          skip_fetch: true

      # 8. 上传产物 (可选，保留 2 天方便下载)
      - name: 📦 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rules-${{ github.run_number }}
          path: my_adg_rules.txt
          retention-days: 2
